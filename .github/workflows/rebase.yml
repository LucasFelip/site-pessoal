name: Rebase desenv to prod after PR merge
on:
  pull_request:
    branches:
      - prod
    types:
      - closed

jobs:
  rebase:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'prod' && github.event.pull_request.head.ref == 'desenv'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout desenv branch
        run: git checkout desenv

      - name: Rebase desenv to prod
        run: |
          git rebase origin/prod || (
            echo "Attempting to resolve conflicts automatically."
            git checkout --theirs .github/workflows/rebase.yml
            git add .github/workflows/rebase.yml
            git rebase --continue || (
              git rebase --abort
              echo "Rebase failed. Please resolve conflicts manually."
              exit 1
            )
          )

      - name: Push rebased desenv branch
        if: success()
        run: git push origin desenv --force-with-lease

      - name: Notify rebase failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner,
              repo,
              title: "Rebase desenv to prod failed",
              body: "The rebase of `desenv` onto `prod` has failed due to conflicts. Please resolve the conflicts manually.",
              labels: ["rebase", "failure"]
            });
