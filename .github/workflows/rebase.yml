name: Update desenv after merging PR to prod
on:
  pull_request:
    branches:
      - prod
    types:
      - closed

jobs:
  update-desenv:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'prod' && github.event.pull_request.head.ref == 'desenv'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Fetch branches
        run: git fetch origin

      - name: Checkout desenv branch
        run: git checkout desenv

      - name: Merge prod into desenv
        run: |
          git merge origin/prod || (
            echo "Merge failed. Please resolve conflicts manually."
            exit 1
          )

      - name: Push updated desenv branch
        if: success()
        run: git push origin desenv

      - name: Notify merge failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner,
              repo,
              title: "Merge prod into desenv failed",
              body: "The merge of `prod` into `desenv` has failed due to conflicts. Please resolve the conflicts manually.",
              labels: ["merge", "failure"]
            });
